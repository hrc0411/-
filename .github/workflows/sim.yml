name: paper-sim
on:
  schedule:
    - cron: "7 * * * *"      # hourly at :07 (1h + 4h accounts; 4h acts only when a 4h bar has closed)
    - cron: "37 4 * * 6"     # Saturday 12:37 SGT weekly report
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: paper-sim
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate accounts
        run: python3 engine.py
      - name: Weekly report
        if: github.event.schedule == '37 4 * * 6'
        run: python3 report.py
      - name: Commit
        run: |
          git config user.name "paper-sim-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A accounts docs weekly
          git diff --cached --quiet && exit 0
          git commit -m "sim: $(TZ=Asia/Singapore date '+%Y-%m-%d %H:%M') SGT"
          for i in 1 2 3; do git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && break; sleep 5; done
