name: paper-sim
on:
  schedule:
    - cron: "7 */3 * * *"   # watchdog only: restarts the chain if a successor could not be queued
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-sim
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Queue the successor FIRST. It waits as "pending" behind this job (same
      # concurrency group) and starts the moment this job ends for any reason:
      # success, failure, timeout, cancellation or a lost runner. Previously the
      # hand-off was the last step and was skipped when the runner died (11-23).
      - name: Queue the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in 1 2 3 4; do
            gh workflow run sim.yml --ref "${GITHUB_REF_NAME}" && exit 0
            sleep $(( i * 10 ))
          done
          echo "::warning::could not queue successor; cron watchdog will restart the chain"
      - name: Evaluate hourly at :07 for ~5.5h
        run: bash run_loop.sh
