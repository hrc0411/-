name: paper-sim
on:
  schedule:
    - cron: "7 */3 * * *"   # watchdog only: restarts the loop if the chain ever dies
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: paper-sim
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Evaluate hourly at :07 for ~5.5h
        run: bash run_loop.sh
      - name: Hand off to the next run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sim.yml --ref "${GITHUB_REF_NAME}"
